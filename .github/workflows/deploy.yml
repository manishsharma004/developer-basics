name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Compute v86 lab image cache key
        id: v86-lab-key
        run: echo "key=$(bash scripts/v86/lab-image-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore v86 lab rootfs cache
        uses: actions/cache/restore@v4
        id: v86-lab-cache
        with:
          path: |
            public/v86/lab-rootfs/manifest.json
            public/v86/lab-rootfs/fs.json
            public/v86/lab-rootfs/flat
            .cache/v86-tools
          key: v86-lab-${{ steps.v86-lab-key.outputs.key }}

      - name: Build v86 Podman lab image
        if: steps.v86-lab-cache.outputs.cache-hit != 'true'
        run: |
          bun run v86:download-bios
          bun run v86:build-image

      - name: Save v86 lab rootfs cache
        if: steps.v86-lab-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            public/v86/lab-rootfs/manifest.json
            public/v86/lab-rootfs/fs.json
            public/v86/lab-rootfs/flat
            .cache/v86-tools
          key: v86-lab-${{ steps.v86-lab-key.outputs.key }}

      - name: Build
        # Vite needs the repo name as the base path for project Pages sites.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
